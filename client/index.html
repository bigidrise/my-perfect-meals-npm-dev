    <style>
      /* Prevent any white flash during boot - Apple HIG compliance */
      html,

        padding: 0;

      #root {

      /* Initial loading state before React hydrates */
      #root:empty {

        align-items: center;
        justify-content: center;
        height: 100dvh;

      }
      #root:empty::after {
        content: "";
        width: 32px;
        height: 32px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
