
name: Localization Quality Gates

on:
  pull_request:
    paths:
      - "client/src/i18n/**"
      - "client/src/**/*.tsx"
      - "client/src/**/*.ts"
      - "scripts/i18n-*.ts"
      - "scripts/pseudo-locale-gen.ts"
  push:
    branches: [main]
    paths:
      - "client/src/i18n/**"

jobs:
  localization-gates:
    name: "Phase 0 Localization Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: "npm"

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.3"
          test "$(npm --version)" = "10.9.9"
          npm ci --foreground-scripts
          test -x node_modules/.bin/tsx
          ./node_modules/.bin/tsx --version

      - name: Upload npm debug logs on install failure
        if: failure() && steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: localization-npm-debug-${{ github.run_attempt }}
          path: ~/.npm/_logs/*-debug-*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

      - name: GATE_02 + GATE_03 + GATE_07 + GATE_08 — Phase 0 Validate
        run: ./node_modules/.bin/tsx scripts/i18n-phase0-validate.ts --ci

      - name: Generate clinical registry (verify it builds)
        run: ./node_modules/.bin/tsx scripts/i18n-clinical-registry.ts

      - name: Fallback detection report
        run: ./node_modules/.bin/tsx scripts/i18n-fallback-detect.ts

      - name: Upload localization reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-reports
          path: docs/localization/
          retention-days: 14
