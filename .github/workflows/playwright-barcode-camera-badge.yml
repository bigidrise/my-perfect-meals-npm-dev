name: Camera barcode badge E2E

on:
  pull_request:
    paths:
      - "client/src/pages/ShoppingListMasterView.tsx"
      - "client/src/components/biometrics/IngredientIntelligenceSheet.tsx"
      - "client/e2e/barcode-camera-database-badge.spec.ts"
      - "playwright.config.ts"

jobs:
  playwright:
    name: "Barcode camera → BarcodeDatabaseBadge"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ci-session-secret-placeholder
      NODE_ENV: development
      E2E_BASE_URL: http://localhost:5000
      # Disable billing enforcement so the test user passes subscription gates
      BILLING_ENFORCED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start dev server (background)
        run: |
          npm run dev &
          echo "DEV_SERVER_PID=$!" >> "$GITHUB_ENV"
        env:
          NODE_ENV: development

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server on port 5000…"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/auth/session > /dev/null 2>&1; then
              echo "Server is up (attempt $i)"
              break
            fi
            echo "  attempt $i — not ready yet"
            sleep 2
          done

      - name: Run barcode camera badge spec
        run: |
          npx playwright test client/e2e/barcode-camera-database-badge.spec.ts \
            --project=chromium \
            --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "$DEV_SERVER_PID" ]; then
            kill "$DEV_SERVER_PID" 2>/dev/null || true
          fi
